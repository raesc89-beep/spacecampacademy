<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    
  <radialGradient id="glow-cyan" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#00CCFF" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#00CCFF" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow-orange" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#FFA500" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#FFA500" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="neon-cyan" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#00CCFF"/>
    <stop offset="100%" stop-color="#0088AA"/>
  </linearGradient>
  <linearGradient id="neon-orange" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FFA500"/>
    <stop offset="100%" stop-color="#FF6B00"/>
  </linearGradient>
  <filter id="neon-glow">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft-glow">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

    <clipPath id="btn-clip-novikov"><circle cx="100" cy="100" r="90"/></clipPath>
    <radialGradient id="btn-bg-novikov" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#050210"/>
    </radialGradient>
    <linearGradient id="btn-ring-novikov" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00CCFF"/>
      <stop offset="50%" stop-color="#FFA500"/>
      <stop offset="100%" stop-color="#FF6B00"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="96" fill="none" stroke="url(#btn-ring-novikov)" stroke-width="3" filter="url(#neon-glow)"/>
  <circle cx="100" cy="100" r="90" fill="url(#btn-bg-novikov)"/>
  <g clip-path="url(#btn-clip-novikov)">
    
    <!-- Shield shape -->
    <path d="M100,40 L140,65 L140,115 C140,140 120,155 100,165 C80,155 60,140 60,115 L60,65 Z" fill="none" stroke="#00CCFF" stroke-width="2.5" filter="url(#neon-glow)"/>
    <path d="M100,50 L132,70 L132,112 C132,133 117,145 100,153 C83,145 68,133 68,112 L68,70 Z" fill="#00CCFF" opacity="0.08"/>
    <!-- Lock icon inside -->
    <rect x="88" y="95" width="24" height="20" rx="3" fill="none" stroke="#FFA500" stroke-width="2"/>
    <path d="M93,95 L93,85 C93,78 107,78 107,85 L107,95" fill="none" stroke="#FFA500" stroke-width="2"/>
    <circle cx="100" cy="107" r="3" fill="#FFA500"/>
    <!-- Cosmic rays bouncing off -->
    <line x1="45" y1="55" x2="62" y2="70" stroke="#FF6B00" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.6"/>
    <line x1="155" y1="55" x2="138" y2="70" stroke="#FF6B00" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.6"/>
    <line x1="40" y1="110" x2="60" y2="112" stroke="#FF6B00" stroke-width="1" stroke-dasharray="3,2" opacity="0.4"/>
    <text x="100" y="75" font-family="monospace" font-size="12" fill="#00CCFF" text-anchor="middle" opacity="0.7">✓</text>

  </g>
  <circle cx="100" cy="100" r="93" fill="none" stroke="url(#btn-ring-novikov)" stroke-width="1.5" opacity="0.5"/>
</svg>