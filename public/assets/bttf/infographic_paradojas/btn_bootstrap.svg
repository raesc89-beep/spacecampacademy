<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    
  <radialGradient id="glow-cyan" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#00CCFF" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#00CCFF" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow-orange" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#FFA500" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#FFA500" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="neon-cyan" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#00CCFF"/>
    <stop offset="100%" stop-color="#0088AA"/>
  </linearGradient>
  <linearGradient id="neon-orange" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FFA500"/>
    <stop offset="100%" stop-color="#FF6B00"/>
  </linearGradient>
  <filter id="neon-glow">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft-glow">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

    <clipPath id="btn-clip-bootstrap"><circle cx="100" cy="100" r="90"/></clipPath>
    <radialGradient id="btn-bg-bootstrap" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#050210"/>
    </radialGradient>
    <linearGradient id="btn-ring-bootstrap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00CCFF"/>
      <stop offset="50%" stop-color="#FFA500"/>
      <stop offset="100%" stop-color="#FF6B00"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="96" fill="none" stroke="url(#btn-ring-bootstrap)" stroke-width="3" filter="url(#neon-glow)"/>
  <circle cx="100" cy="100" r="90" fill="url(#btn-bg-bootstrap)"/>
  <g clip-path="url(#btn-clip-bootstrap)">
    
    <!-- Infinity loop / Möbius -->
    <path d="M60,100 C60,70 80,55 100,75 C120,55 140,70 140,100 C140,130 120,145 100,125 C80,145 60,130 60,100 Z" fill="none" stroke="#00CCFF" stroke-width="2.5" filter="url(#neon-glow)"/>
    <!-- Clock embedded in center -->
    <circle cx="100" cy="100" r="15" fill="#1a0a2e" stroke="#FFA500" stroke-width="1.5"/>
    <line x1="100" y1="100" x2="100" y2="90" stroke="#FFA500" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="100" y1="100" x2="108" y2="104" stroke="#00CCFF" stroke-width="1" stroke-linecap="round"/>
    <circle cx="100" cy="100" r="2" fill="#FFA500"/>
    <!-- Flow arrows on the loop -->
    <polygon points="78,72 82,68 84,74" fill="#00CCFF"/>
    <polygon points="122,128 118,132 116,126" fill="#00CCFF"/>
    <!-- Small info arrows -->
    <circle cx="68" cy="108" r="3" fill="#FFA500" opacity="0.6"/>
    <circle cx="132" cy="92" r="3" fill="#FFA500" opacity="0.6"/>

  </g>
  <circle cx="100" cy="100" r="93" fill="none" stroke="url(#btn-ring-bootstrap)" stroke-width="1.5" opacity="0.5"/>
</svg>