<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    
  <radialGradient id="glow-cyan" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#00CCFF" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#00CCFF" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow-orange" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#FFA500" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#FFA500" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="neon-cyan" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#00CCFF"/>
    <stop offset="100%" stop-color="#0088AA"/>
  </linearGradient>
  <linearGradient id="neon-orange" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FFA500"/>
    <stop offset="100%" stop-color="#FF6B00"/>
  </linearGradient>
  <filter id="neon-glow">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft-glow">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

    <clipPath id="btn-clip-gemelos"><circle cx="100" cy="100" r="90"/></clipPath>
    <radialGradient id="btn-bg-gemelos" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#050210"/>
    </radialGradient>
    <linearGradient id="btn-ring-gemelos" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00CCFF"/>
      <stop offset="50%" stop-color="#FFA500"/>
      <stop offset="100%" stop-color="#FF6B00"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="96" fill="none" stroke="url(#btn-ring-gemelos)" stroke-width="3" filter="url(#neon-glow)"/>
  <circle cx="100" cy="100" r="90" fill="url(#btn-bg-gemelos)"/>
  <g clip-path="url(#btn-clip-gemelos)">
    
    <!-- Two figures -->
    <!-- Young astronaut (left) -->
    <circle cx="70" cy="75" r="12" fill="none" stroke="#00CCFF" stroke-width="2"/>
    <line x1="70" y1="87" x2="70" y2="120" stroke="#00CCFF" stroke-width="2"/>
    <line x1="70" y1="95" x2="55" y2="108" stroke="#00CCFF" stroke-width="1.5"/>
    <line x1="70" y1="95" x2="85" y2="108" stroke="#00CCFF" stroke-width="1.5"/>
    <line x1="70" y1="120" x2="60" y2="145" stroke="#00CCFF" stroke-width="1.5"/>
    <line x1="70" y1="120" x2="80" y2="145" stroke="#00CCFF" stroke-width="1.5"/>
    <!-- Old astronaut (right) - slightly bent -->
    <circle cx="130" cy="75" r="12" fill="none" stroke="#FFA500" stroke-width="2"/>
    <path d="M130,87 C130,100 128,110 126,120" fill="none" stroke="#FFA500" stroke-width="2"/>
    <line x1="130" y1="95" x2="115" y2="105" stroke="#FFA500" stroke-width="1.5"/>
    <line x1="130" y1="95" x2="142" y2="108" stroke="#FFA500" stroke-width="1.5"/>
    <line x1="126" y1="120" x2="116" y2="145" stroke="#FFA500" stroke-width="1.5"/>
    <line x1="126" y1="120" x2="134" y2="145" stroke="#FFA500" stroke-width="1.5"/>
    <!-- Clock fast (left) -->
    <text x="70" y="55" font-family="monospace" font-size="10" fill="#00CCFF" text-anchor="middle">⏱ 1yr</text>
    <!-- Clock slow (right) -->
    <text x="130" y="55" font-family="monospace" font-size="10" fill="#FFA500" text-anchor="middle">⏱ 30yr</text>
    <!-- Connecting arrow -->
    <path d="M88,100 L112,100" stroke="white" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
    <text x="100" y="96" font-family="monospace" font-size="8" fill="white" text-anchor="middle" opacity="0.5">≠</text>

  </g>
  <circle cx="100" cy="100" r="93" fill="none" stroke="url(#btn-ring-gemelos)" stroke-width="1.5" opacity="0.5"/>
</svg>