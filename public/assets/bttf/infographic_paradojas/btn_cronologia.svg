<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    
  <radialGradient id="glow-cyan" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#00CCFF" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#00CCFF" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow-orange" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#FFA500" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#FFA500" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="neon-cyan" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#00CCFF"/>
    <stop offset="100%" stop-color="#0088AA"/>
  </linearGradient>
  <linearGradient id="neon-orange" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FFA500"/>
    <stop offset="100%" stop-color="#FF6B00"/>
  </linearGradient>
  <filter id="neon-glow">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft-glow">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

    <clipPath id="btn-clip-cronologia"><circle cx="100" cy="100" r="90"/></clipPath>
    <radialGradient id="btn-bg-cronologia" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#050210"/>
    </radialGradient>
    <linearGradient id="btn-ring-cronologia" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00CCFF"/>
      <stop offset="50%" stop-color="#FFA500"/>
      <stop offset="100%" stop-color="#FF6B00"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="96" fill="none" stroke="url(#btn-ring-cronologia)" stroke-width="3" filter="url(#neon-glow)"/>
  <circle cx="100" cy="100" r="90" fill="url(#btn-bg-cronologia)"/>
  <g clip-path="url(#btn-clip-cronologia)">
    
    <!-- Main timeline trunk -->
    <line x1="100" y1="165" x2="100" y2="85" stroke="#00CCFF" stroke-width="2.5" filter="url(#neon-glow)"/>
    <!-- Branching paths -->
    <line x1="100" y1="120" x2="60" y2="80" stroke="#FFA500" stroke-width="1.5"/>
    <line x1="100" y1="120" x2="140" y2="80" stroke="#FF6B00" stroke-width="1.5"/>
    <line x1="100" y1="85" x2="70" y2="50" stroke="#00CCFF" stroke-width="1.5"/>
    <line x1="100" y1="85" x2="130" y2="50" stroke="#FFA500" stroke-width="1.5"/>
    <line x1="100" y1="85" x2="100" y2="40" stroke="#00CCFF" stroke-width="1.5"/>
    <!-- Quantum nodes -->
    <circle cx="100" cy="165" r="5" fill="#00CCFF" filter="url(#neon-glow)"/>
    <circle cx="100" cy="120" r="5" fill="#FFA500" filter="url(#neon-glow)"/>
    <circle cx="60" cy="80" r="4" fill="#FFA500" opacity="0.7"/>
    <circle cx="140" cy="80" r="4" fill="#FF6B00" opacity="0.7"/>
    <circle cx="100" cy="85" r="5" fill="#00CCFF" filter="url(#neon-glow)"/>
    <circle cx="70" cy="50" r="4" fill="#00CCFF" opacity="0.7"/>
    <circle cx="130" cy="50" r="4" fill="#FFA500" opacity="0.7"/>
    <circle cx="100" cy="40" r="4" fill="#00CCFF" opacity="0.7"/>
    <!-- Pulse rings -->
    <circle cx="100" cy="120" r="10" fill="none" stroke="#FFA500" stroke-width="0.5" opacity="0.4"/>
    <circle cx="100" cy="85" r="10" fill="none" stroke="#00CCFF" stroke-width="0.5" opacity="0.4"/>

  </g>
  <circle cx="100" cy="100" r="93" fill="none" stroke="url(#btn-ring-cronologia)" stroke-width="1.5" opacity="0.5"/>
</svg>