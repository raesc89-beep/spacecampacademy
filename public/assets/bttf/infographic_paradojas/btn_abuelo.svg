<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    
  <radialGradient id="glow-cyan" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#00CCFF" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#00CCFF" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow-orange" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#FFA500" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#FFA500" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="neon-cyan" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#00CCFF"/>
    <stop offset="100%" stop-color="#0088AA"/>
  </linearGradient>
  <linearGradient id="neon-orange" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FFA500"/>
    <stop offset="100%" stop-color="#FF6B00"/>
  </linearGradient>
  <filter id="neon-glow">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft-glow">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

    <clipPath id="btn-clip-abuelo"><circle cx="100" cy="100" r="90"/></clipPath>
    <radialGradient id="btn-bg-abuelo" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#050210"/>
    </radialGradient>
    <linearGradient id="btn-ring-abuelo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00CCFF"/>
      <stop offset="50%" stop-color="#FFA500"/>
      <stop offset="100%" stop-color="#FF6B00"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="96" fill="none" stroke="url(#btn-ring-abuelo)" stroke-width="3" filter="url(#neon-glow)"/>
  <circle cx="100" cy="100" r="90" fill="url(#btn-bg-abuelo)"/>
  <g clip-path="url(#btn-clip-abuelo)">
    
    <!-- Family tree splitting -->
    <line x1="100" y1="160" x2="100" y2="110" stroke="#00CCFF" stroke-width="2.5" filter="url(#neon-glow)"/>
    <line x1="100" y1="110" x2="70" y2="70" stroke="#00CCFF" stroke-width="2" filter="url(#neon-glow)"/>
    <line x1="100" y1="110" x2="130" y2="70" stroke="#FFA500" stroke-width="2" filter="url(#neon-glow)" opacity="0.4"/>
    <!-- Nodes -->
    <circle cx="100" cy="160" r="8" fill="#1a0a2e" stroke="#00CCFF" stroke-width="2"/>
    <circle cx="100" cy="110" r="6" fill="#1a0a2e" stroke="#FFA500" stroke-width="2"/>
    <circle cx="70" cy="70" r="8" fill="#1a0a2e" stroke="#00CCFF" stroke-width="2"/>
    <circle cx="130" cy="70" r="8" fill="#1a0a2e" stroke="#FFA500" stroke-width="2" opacity="0.35"/>
    <!-- Branches fading -->
    <line x1="70" y1="70" x2="50" y2="40" stroke="#00CCFF" stroke-width="1.5" filter="url(#neon-glow)"/>
    <line x1="70" y1="70" x2="90" y2="40" stroke="#00CCFF" stroke-width="1.5" filter="url(#neon-glow)"/>
    <circle cx="50" cy="40" r="5" fill="#00CCFF" opacity="0.7"/>
    <circle cx="90" cy="40" r="5" fill="#00CCFF" opacity="0.7"/>
    <line x1="130" y1="70" x2="120" y2="40" stroke="#FFA500" stroke-width="1" opacity="0.2"/>
    <line x1="130" y1="70" x2="145" y2="40" stroke="#FFA500" stroke-width="1" opacity="0.15"/>
    <circle cx="120" cy="40" r="4" fill="#FFA500" opacity="0.15"/>
    <circle cx="145" cy="40" r="4" fill="#FFA500" opacity="0.1"/>
    <!-- Question mark -->
    <text x="132" y="62" font-family="monospace" font-size="14" fill="#FFA500" opacity="0.5" text-anchor="middle">?</text>

  </g>
  <circle cx="100" cy="100" r="93" fill="none" stroke="url(#btn-ring-abuelo)" stroke-width="1.5" opacity="0.5"/>
</svg>