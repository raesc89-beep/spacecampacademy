<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview — El Nilo de Nut — Infografía Interactiva</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Outfit', sans-serif; background: #0a0a1a; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .infographic { background: linear-gradient(180deg, #0B0E2D 0%, #1A1040 40%, #0B0E2D 100%); border-radius: 24px; padding: 2rem; position: relative; overflow: hidden; border: 1px solid rgba(232,201,106,0.12); box-shadow: 0 0 60px rgba(11,14,45,0.8), inset 0 0 80px rgba(0,0,0,0.3); max-width: 900px; width: 100%; }
    .star-field { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
    .star { position: absolute; border-radius: 50%; background: #fff; animation: twinkle var(--dur, 3s) ease-in-out infinite; animation-delay: var(--delay, 0s); }
    @keyframes twinkle { 0%, 100% { opacity: var(--omin, 0.15); } 50% { opacity: var(--omax, 0.6); } }
    .nut-header { width: 100%; text-align: center; position: relative; z-index: 2; margin-bottom: -10px; }
    .nut-header svg { width: 100%; max-width: 600px; height: auto; filter: drop-shadow(0 0 10px rgba(232,201,106,0.3)); }
    .progress-wrap { position: relative; z-index: 2; max-width: 400px; margin: 0 auto 1.5rem; }
    .progress-bar { display: flex; align-items: center; gap: 0.8rem; padding: 0.6rem 1rem; background: rgba(255,255,255,0.03); border-radius: 30px; border: 1px solid rgba(232,201,106,0.15); }
    .progress-track { flex: 1; height: 6px; background: rgba(255,255,255,0.06); border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #E8C96A, #FFD700); border-radius: 3px; box-shadow: 0 0 8px rgba(232,201,106,0.4); transition: width 0.5s; }
    .progress-count { font-size: 0.75rem; color: #E8C96A; font-family: monospace; font-weight: bold; min-width: 45px; text-align: right; }
    .hint { text-align: center; color: rgba(232,201,106,0.7); font-size: 0.85rem; margin-bottom: 1rem; position: relative; z-index: 2; animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    .nodes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 0.8rem; position: relative; z-index: 2; margin-bottom: 1.5rem; }
    .node-btn { background: rgba(255,255,255,0.03); border: 2px solid rgba(232,201,106,0.25); border-radius: 16px; padding: 1.2rem 1rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 0.6rem; transition: all 0.3s; position: relative; overflow: hidden; width: 100%; }
    .node-btn:hover { transform: scale(1.05) translateY(-3px); }
    .node-btn.active { transform: scale(1.05); }
    .node-btn .emoji { font-size: 2rem; line-height: 1; transition: filter 0.3s; }
    .node-btn.active .emoji { animation: nodePulse 1.5s ease-in-out infinite; }
    @keyframes nodePulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
    .node-btn .title { color: rgba(255,255,255,0.75); font-size: 0.85rem; font-weight: 700; letter-spacing: 0.5px; text-align: center; line-height: 1.3; transition: color 0.3s; }
    .node-btn .hieroglyph { position: absolute; top: 5px; right: 8px; font-size: 1.4rem; opacity: 0.08; font-family: serif; pointer-events: none; }
    .node-btn .active-indicator { position: absolute; bottom: 0; left: 20%; right: 20%; height: 3px; border-radius: 3px 3px 0 0; display: none; }
    .node-btn.active .active-indicator { display: block; }
    .content-panel { background: rgba(15, 15, 40, 0.85); backdrop-filter: blur(20px); border-radius: 20px; padding: 2rem; position: relative; overflow: hidden; display: none; z-index: 2; animation: fadeInUp 0.4s ease-out; }
    .content-panel.visible { display: block; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .close-btn { position: absolute; top: 12px; right: 12px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: rgba(255,255,255,0.6); font-size: 1.1rem; transition: background 0.2s; z-index: 5; }
    .close-btn:hover { background: rgba(255,255,255,0.15); }
    .panel-header { display: flex; align-items: center; gap: 0.8rem; margin-bottom: 1.5rem; }
    .panel-header .emoji { font-size: 2.5rem; line-height: 1; }
    .panel-header h3 { margin: 0; font-size: 1.3rem; font-weight: 800; letter-spacing: 0.5px; }
    .panel-header .hieroglyphs { font-size: 1.2rem; opacity: 0.12; font-family: serif; }
    .panel-content { display: flex; flex-direction: column; gap: 1rem; }
    .panel-content p { margin: 0; font-size: 1rem; line-height: 1.8; color: rgba(255,255,255,0.85); }
    .panel-content .callout { border-radius: 12px; padding: 1rem 1.2rem; display: flex; align-items: flex-start; gap: 0.6rem; }
    .panel-content .callout p { font-style: italic; color: rgba(255,255,255,0.9); font-size: 0.95rem; line-height: 1.75; }
    .completion { text-align: center; margin-top: 1.5rem; padding: 1rem; border-radius: 16px; position: relative; z-index: 2; background: rgba(232,201,106,0.08); border: 1px solid rgba(232,201,106,0.25); display: none; }
    .completion.visible { display: block; animation: fadeInUp 0.5s ease-out; }
    .completion p:first-child { color: #FFD700; font-size: 1.1rem; font-weight: bold; }
    .completion p:last-child { margin-top: 0.4rem; color: rgba(255,255,255,0.6); font-size: 0.85rem; }
  </style>
</head>
<body>
<div class="infographic" id="infographic">
  <div class="star-field" id="starField"></div>
  <div class="nut-header">
    <svg viewBox="0 0 600 120">
      <path d="M 30 110 Q 80 20, 300 10 Q 520 20, 570 110" fill="none" stroke="url(#nutGrad)" stroke-width="3" stroke-linecap="round"/>
      <circle cx="80" cy="27" r="3" fill="#FFD700" style="filter:drop-shadow(0 0 6px #FFD700);animation:twinkle 2s ease-in-out infinite;"/>
      <circle cx="150" cy="17" r="3" fill="#FFD700" style="filter:drop-shadow(0 0 6px #FFD700);animation:twinkle 2.5s ease-in-out infinite 0.5s;"/>
      <circle cx="220" cy="12" r="3" fill="#FFD700" style="filter:drop-shadow(0 0 6px #FFD700);animation:twinkle 3s ease-in-out infinite 1s;"/>
      <circle cx="300" cy="23" r="3" fill="#FFD700" style="filter:drop-shadow(0 0 6px #FFD700);animation:twinkle 2.2s ease-in-out infinite 1.5s;"/>
      <circle cx="380" cy="12" r="3" fill="#FFD700" style="filter:drop-shadow(0 0 6px #FFD700);animation:twinkle 2.8s ease-in-out infinite 2s;"/>
      <circle cx="450" cy="17" r="3" fill="#FFD700" style="filter:drop-shadow(0 0 6px #FFD700);animation:twinkle 3.2s ease-in-out infinite 2.5s;"/>
      <circle cx="520" cy="27" r="3" fill="#FFD700" style="filter:drop-shadow(0 0 6px #FFD700);animation:twinkle 2.6s ease-in-out infinite 3s;"/>
      <circle cx="30" cy="110" r="5" fill="rgba(232,201,106,0.6)"/><circle cx="570" cy="110" r="5" fill="rgba(232,201,106,0.6)"/>
      <circle cx="300" cy="8" r="7" fill="rgba(232,201,106,0.8)" style="filter:drop-shadow(0 0 8px rgba(232,201,106,0.5));"/>
      <defs><linearGradient id="nutGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="rgba(232,201,106,0.3)"/><stop offset="50%" stop-color="rgba(232,201,106,0.9)"/><stop offset="100%" stop-color="rgba(232,201,106,0.3)"/></linearGradient></defs>
      <text x="300" y="80" text-anchor="middle" fill="#E8C96A" font-size="18" font-weight="bold" font-family="Georgia, serif" letter-spacing="3">EL NILO DE NUT</text>
      <text x="300" y="100" text-anchor="middle" fill="rgba(232,201,106,0.6)" font-size="11" font-family="monospace" letter-spacing="2">LA VIA LACTEA EN EL ANTIGUO EGIPTO</text>
    </svg>
  </div>
  <div class="progress-wrap"><div class="progress-bar"><span style="color:#E8C96A;">&#11088;</span><div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%;"></div></div><span class="progress-count" id="progressCount">0/8</span></div></div>
  <p class="hint" id="hint">&#9654; Haz clic en cada tema para explorar &#9654;</p>
  <div class="nodes-grid" id="nodesGrid"></div>
  <div class="content-panel" id="contentPanel"><div id="cornerTL"></div><div id="cornerBR"></div><button class="close-btn" onclick="closePanel()">&#10005;</button><div class="panel-header" id="panelHeader"></div><div class="panel-content" id="panelContent"></div></div>
  <div class="completion" id="completion"><p>&#127942; &#161;Has explorado todos los secretos del Nilo de Nut!</p><p>Ahora puedes tomar el quiz para ganar tu insignia de Navegante Galactico</p></div>
</div>
<script>
const NODES=[{id:'nut',emoji:'&#127769;',title:'&#191;Qui&#233;n es Nut?',color:'#C4A7E7',icon:'\u{13047}',content:['Imagina que pudieras ver a una persona gigante estir\u00e1ndose de un lado al otro del cielo. \u00a1As\u00ed ve\u00edan los antiguos egipcios a Nut, la diosa del cielo!','Los egipcios imaginaban a Nut como una mujer enorme que se arqueaba sobre la Tierra. Sus dedos de los pies tocaban un horizonte y sus manos el otro.','Las estrellas eran joyas brillantes pintadas en su piel. Cada noche, Nut se tragaba al Sol por el oeste y lo hac\u00eda nacer de nuevo por el este cada ma\u00f1ana.','Dato curioso: Nut aparece pintada dentro de muchos sarc\u00f3fagos egipcios. Los difuntos eran colocados "dentro del vientre de Nut", esperando renacer como estrellas nuevas.']},{id:'nilo',emoji:'&#127754;',title:'El Nilo del Cielo',color:'#7EC8E3',icon:'\u{13216}',content:['\u00bfHas visto alguna vez la V\u00eda L\u00e1ctea en una noche sin luces de ciudad? Es una franja de luz blanca que cruza todo el cielo, como un r\u00edo de estrellas.','Los egipcios la ve\u00edan claramente porque viv\u00edan en el desierto, sin contaminaci\u00f3n lum\u00ednica. Para ellos, esa franja brillante era un r\u00edo celeste.','El Nilo era el r\u00edo m\u00e1s importante de Egipto. Les daba agua, comida y vida. Imaginar otro Nilo all\u00e1 arriba, hecho de estrellas, era una forma hermosa de conectar el cielo con la Tierra.','Dato curioso: En julio y agosto, cuando el Nilo se inundaba, la V\u00eda L\u00e1ctea estaba en su posici\u00f3n m\u00e1s visible. \u00a1El Nilo de arriba y el de abajo coincid\u00edan!']},{id:'arriba',emoji:'&#10024;',title:'Como es Arriba, es Abajo',color:'#FFD700',icon:'\u{13080}',content:['Los egipcios ten\u00edan una idea muy bonita: lo que pasa en el cielo tambi\u00e9n pasa en la Tierra.','Este principio se resume en una frase famosa: "Como es arriba, es abajo." El cielo es un espejo de la Tierra.','Por eso constru\u00edan templos alineados con las estrellas. Quer\u00edan que sus edificios coincidieran exactamente con lo que ve\u00edan en el cielo.','Ejemplo f\u00e1cil: Piensa en cuando ves la Luna reflejada en un lago. Hay una Luna arriba y otra "abajo" en el agua. Los egipcios pensaban que todo el universo funcionaba as\u00ed.']},{id:'orion',emoji:'&#128314;',title:'Ori\u00f3n y las Pir\u00e1mides',color:'#E8C96A',icon:'\u{13254}',content:['Las tres famosas pir\u00e1mides de Guiza est\u00e1n alineadas de una forma muy curiosa. En 1994, Robert Bauval propuso una hip\u00f3tesis interesante.','Las tres pir\u00e1mides podr\u00edan imitar la posici\u00f3n de las tres estrellas del Cintur\u00f3n de Ori\u00f3n (Alnitak, Alnilam y Mintaka).','Importante: Esta es una hip\u00f3tesis, no un hecho comprobado. En ciencia, siempre es bueno cuestionar y verificar.','Lo que s\u00ed sabemos con certeza es que los egipcios conoc\u00edan muy bien la constelaci\u00f3n de Ori\u00f3n. La asociaban con Osiris, el dios de la resurrecci\u00f3n.']},{id:'sagitario',emoji:'&#128371;',title:'El Monstruo del Centro',color:'#FF6B6B',icon:'\u{131A3}',content:['\u00bfVes la parte m\u00e1s brillante de la V\u00eda L\u00e1ctea? Est\u00e1 en la direcci\u00f3n de Sagitario. Ah\u00ed se esconde un agujero negro supermasivo!','Se llama Sagitario A* y tiene la masa de 4 millones de soles aplastados en un punto. Ni la luz puede escapar de \u00e9l.','En 2020, Reinhard Genzel y Andrea Ghez ganaron el Premio Nobel de F\u00edsica por demostrar que este agujero negro existe. \u00a1Observaron estrellas girando alrededor de algo invisible!','Dato curioso: Si los egipcios hubieran sabido esto, seguramente habr\u00edan dicho que Apofis, la serpiente del caos, estaba ah\u00ed devorando la luz.']},{id:'faraon',emoji:'&#128081;',title:'El Viaje del Fara\u00f3n',color:'#F5A623',icon:'\u{130B9}',content:['Dentro de las pir\u00e1mides m\u00e1s antiguas se encontraron los "Textos de las Pir\u00e1mides", escritos hace unos 4,400 a\u00f1os. \u00a1Son los textos religiosos m\u00e1s antiguos del mundo!','Estos textos describen un viaje \u00e9pico: cuando el fara\u00f3n mor\u00eda, su alma viajaba por la V\u00eda L\u00e1ctea para reunirse con Osiris en Ori\u00f3n.','El fara\u00f3n era Osiris, y la reina era Isis (la estrella Sirio). Morir no era el final, sino el comienzo de un viaje c\u00f3smico entre las estrellas.','\u00bfSab\u00edas que...? Los techos de las tumbas se pintaban con estrellas doradas sobre fondo azul. El difunto estaba dentro del vientre de Nut.']},{id:'navegantes',emoji:'&#9973;',title:'\u00a1Navegantes del Nilo!',color:'#4ECDC4',icon:'\u{1329D}',content:['La V\u00eda L\u00e1ctea no solo era bonita: \u00a1era \u00fatil! Los marineros egipcios la usaban para orientarse por la noche.','Combinada con la estrella polar, la V\u00eda L\u00e1ctea era parte del "GPS antiguo" que permit\u00eda navegar desde Egipto hasta Creta y Fenicia.','En el desierto del Sahara, la V\u00eda L\u00e1ctea proyecta una sombra tenue sobre el suelo. \u00a1Una sombra hecha de luz de estrellas!','Dato incre\u00edble: Los astr\u00f3nomos modernos instalan telescopios en desiertos remotos por la misma raz\u00f3n que los sacerdotes egipcios observaban desde all\u00ed.']},{id:'numeros',emoji:'&#128290;',title:'Nuestra Galaxia en N\u00fameros',color:'#00E4FF',icon:'\u{13279}',content:['La V\u00eda L\u00e1ctea tiene entre 100,000 y 200,000 a\u00f1os luz de di\u00e1metro. La luz tarda 100,000 a\u00f1os en cruzarla.','Contiene hasta 400,000 millones de estrellas. Nuestro Sol tarda 225 millones de a\u00f1os en dar una sola vuelta. \u00a1Se llama "a\u00f1o gal\u00e1ctico"!','La galaxia m\u00e1s cercana es Andr\u00f3meda, a 2.5 millones de a\u00f1os luz. M\u00e1s all\u00e1 hay miles de millones de galaxias.','Dato curioso: "V\u00eda L\u00e1ctea" viene de los griegos. "Galaxias" significa "leche". Los egipcios simplemente la llamaban: "el Nilo del cielo".']}];
let activeNode=null;const explored=new Set();
const sf=document.getElementById('starField');for(let i=0;i<80;i++){const s=document.createElement('div');s.className='star';const sz=Math.random()*2+0.5,o=Math.random()*0.5+0.15;s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:${sz}px;height:${sz}px;--dur:${2+Math.random()*4}s;--delay:${Math.random()*3}s;--omin:${o};--omax:${o*2.5};box-shadow:0 0 ${sz*3}px rgba(200,220,255,${o});`;sf.appendChild(s);}
const grid=document.getElementById('nodesGrid');NODES.forEach(n=>{const b=document.createElement('button');b.className='node-btn';b.dataset.id=n.id;b.innerHTML=`<span class="hieroglyph" style="color:${n.color}">${n.icon}</span><span class="emoji">${n.emoji}</span><span class="title">${n.title}</span><div class="active-indicator" style="background:${n.color};box-shadow:0 0 10px ${n.color};"></div>`;b.addEventListener('click',()=>toggleNode(n.id));grid.appendChild(b);});
function toggleNode(id){if(activeNode===id){closePanel();return;}activeNode=id;explored.add(id);updateProgress();const n=NODES.find(x=>x.id===id);document.querySelectorAll('.node-btn').forEach(b=>{const a=b.dataset.id===id;b.classList.toggle('active',a);const nn=NODES.find(x=>x.id===b.dataset.id);b.style.background=a?`linear-gradient(135deg,${nn.color}25,${nn.color}10)`:'rgba(255,255,255,0.03)';b.style.borderColor=a?nn.color:'rgba(232,201,106,0.25)';b.style.boxShadow=a?`0 0 25px ${nn.color}60, 0 4px 20px rgba(0,0,0,0.4)`:'none';b.querySelector('.title').style.color=a?nn.color:'rgba(255,255,255,0.75)';b.querySelector('.emoji').style.filter=a?`drop-shadow(0 0 8px ${nn.color})`:'none';});const p=document.getElementById('contentPanel');p.style.borderColor=n.color+'40';p.style.boxShadow=`0 0 40px ${n.color}15, 0 8px 32px rgba(0,0,0,0.5)`;document.getElementById('cornerTL').style.cssText=`position:absolute;top:0;left:0;width:50px;height:50px;border-top:2px solid ${n.color}50;border-left:2px solid ${n.color}50;border-radius:20px 0 0 0;`;document.getElementById('cornerBR').style.cssText=`position:absolute;bottom:0;right:0;width:50px;height:50px;border-bottom:2px solid ${n.color}50;border-right:2px solid ${n.color}50;border-radius:0 0 20px 0;`;document.getElementById('panelHeader').innerHTML=`<span class="emoji" style="filter:drop-shadow(0 0 12px ${n.color});">${n.emoji}</span><div><h3 style="color:${n.color};">${n.title}</h3><span class="hieroglyphs" style="color:${n.color};">${n.icon} ${n.icon} ${n.icon}</span></div>`;const c=document.getElementById('panelContent');c.innerHTML=n.content.map((t,i)=>{const isCO=t.startsWith('Dato')||t.startsWith('Ejemplo')||t.startsWith('Importante')||t.startsWith('\u00bfSab');if(isCO)return`<div class="callout" style="background:${n.color}10;border:1px solid ${n.color}30;"><span style="color:${n.color};flex-shrink:0;margin-top:2px;">&#10024;</span><p>${t}</p></div>`;return`<p style="${i>0?`padding-left:0.5rem;border-left:2px solid ${n.color}20;`:''}">${t}</p>`;}).join('');p.classList.add('visible');p.style.animation='none';p.offsetHeight;p.style.animation='fadeInUp 0.4s ease-out';}
function closePanel(){activeNode=null;document.getElementById('contentPanel').classList.remove('visible');document.querySelectorAll('.node-btn').forEach(b=>{b.classList.remove('active');b.style.background='rgba(255,255,255,0.03)';b.style.borderColor='rgba(232,201,106,0.25)';b.style.boxShadow='none';b.querySelector('.title').style.color='rgba(255,255,255,0.75)';b.querySelector('.emoji').style.filter='none';});}
function updateProgress(){const pct=(explored.size/NODES.length)*100;document.getElementById('progressFill').style.width=pct+'%';document.getElementById('progressCount').textContent=explored.size+'/'+NODES.length;if(explored.size>0)document.getElementById('hint').style.display='none';if(explored.size===NODES.length)document.getElementById('completion').classList.add('visible');}
</script>
</body>
</html>
